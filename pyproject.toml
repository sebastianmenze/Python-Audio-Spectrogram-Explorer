[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pase"
dynamic = ["version"]  # Version comes from git tags
description = "Python Audio Spectrogram Explorer (PASE) - A GUI tool for marine acoustic analysis"
authors = [
    {name = "Sebastian Menze", email = "sebastian.menze@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["audio", "spectrogram", "acoustics", "marine-biology", "bioacoustics", "passive-acoustics"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PyQt5>=5.15.0",
    "matplotlib>=3.3.0",
    "scipy>=1.5.0",
    "soundfile>=0.10.0",
    "numpy>=1.19.0",
    "pandas>=1.1.0",
    "sounddevice>=0.4.0",
    "scikit-image>=0.17.0",
]

[project.optional-dependencies]
video = [
    "moviepy>=1.0.3",
    "imageio-ffmpeg>=0.4.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "isort>=5.10.0",
]
all = [
    "pase[video,dev]",
]

[project.urls]
Homepage = "https://github.com/sebastianmenze/pase"
Repository = "https://github.com/sebastianmenze/pase"
Issues = "https://github.com/sebastianmenze/pase/issues"

[project.scripts]
pase = "pase.pase:start"

[tool.setuptools_scm]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 120

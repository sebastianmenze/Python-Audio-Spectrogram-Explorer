[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pase"
version = "3.1.0"
description = "Python Audio Spectrogram Explorer (PASE) - A GUI tool for marine acoustic analysis and annotation"
authors = [
    {name = "Sebastian Menze", email = "sebastian.menze@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["audio", "spectrogram", "acoustics", "annotation", "marine-biology", "bioacoustics", "passive-acoustics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PyQt5>=5.15.0",
    "matplotlib>=3.3.0",
    "scipy>=1.5.0",
    "soundfile>=0.10.0",
    "numpy>=1.19.0",
    "pandas>=1.1.0",
    "sounddevice>=0.4.0",
    "scikit-image>=0.17.0",
]

[project.optional-dependencies]
video = [
    "moviepy>=1.0.3",
    "imageio-ffmpeg>=0.4.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "isort>=5.10.0",
]
all = [
    "pase[video,dev]",
]

[project.urls]
Homepage = "https://github.com/sebastianmenze/pase"
Repository = "https://github.com/sebastianmenze/pase"
Documentation = "https://github.com/sebastianmenze/pase/blob/main/README.md"
"Bug Tracker" = "https://github.com/sebastianmenze/pase/issues"

[project.scripts]
pase = "pase:start"

[tool.setuptools.packages.find]
where = ["."]
include = ["pase*"]

[tool.setuptools.package-data]
pase = ["*.ui", "*.qrc"]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
